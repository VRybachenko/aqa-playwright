name: Playwright Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: [qauto1, qauto2]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm install

      - name: Install Playwright browsers
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npx playwright install --with-deps

      - name: Run tests on ${{ matrix.env }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          command: npx playwright test --grep @smoke
        env:
          ENV: ${{ matrix.env }}
          BASE_URL: ${{ matrix.env == 'qauto1' && secrets.BASE_URL_QAUTO1 || secrets.BASE_URL_QAUTO2 }}
          HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
          HTTP_PASSWORD: ${{ secrets.HTTP_PASSWORD }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.env }}
          path: playwright-report/